  <script>
  /* =========================================================================
     ⚙️ تنظیمات فروشنده (Seller / White-label Config)
     -------------------------------------------------------------------------
     هر فروشنده‌ای که این فایل را برای فروش خودش سفارشی‌سازی می‌کند، کافیست
     همین بخش را ویرایش کند — نیازی به دستکاری کد فشرده‌شده (minified) پایین نیست.
     چون این یک فایل استاتیک بدون بک‌اند است، این مقادیر «پیش‌فرض سراسری»‌اند و
     برای همهٔ کسانی که از همین نسخهٔ فایل استفاده می‌کنند اعمال می‌شوند.
     در تب «تنظیمات» برنامه هم یک پنل «🔧 تنظیمات فروشنده» اضافه شده که امکان
     تغییر آدرس کیف‌پول از داخل همان مرورگر را می‌دهد (فقط برای همان دستگاه)؛
